name: Course descriptions («وصف المواد»)

# runs at once when the reader changes, and with the hourly update (update-data.yml) afterwards
on:
  push:
    paths:
      - scripts/update_course_desc.py
      - .github/workflows/update-course-desc.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-desc
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber pypdfium2 pillow
      - run: python scripts/update_course_desc.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/course_descriptions.json data/coursedesc
          if ! git diff --cached --quiet; then
            git commit -m "Course descriptions $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash -q origin main || true
            git push
          fi
