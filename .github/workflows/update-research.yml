name: Update research data

# Weekly refresh of data/research/*.json (the research pages).
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   SCOPUS_API_KEY    Elsevier API key from https://dev.elsevier.com (Scopus author metrics + university documents)
#   SCOPUS_INSTTOKEN  institutional token, only if Elsevier gave you one
#   SERPAPI_KEY       reliable Google Scholar metrics through serpapi.com (otherwise read directly, best effort)
#   OPENALEX_API_KEY  free key from openalex.org (larger daily budget)
#   WOS_API_KEY       free Web of Science Starter API key (developer.clarivate.com, Free Institutional Member plan)
on:
  schedule:
    - cron: '17 1 * * 0'        # Sundays 04:17 Amman time
  workflow_dispatch:
    inputs:
      only:
        description: 'Only one researcher (staff e-mail), leave empty for everyone'
        required: false
        default: ''
  push:
    paths:
      - 'data/research/scopus_export/**'   # a new Scopus CSV export triggers a rebuild
      - 'data/research/wos_export/**'      # a new Web of Science export too
      - 'data/research/overrides.json'
      - 'data/research/manual/**'          # manual corrections and additions (CSV)
      - 'data/research/universities_export/**'   # Scopus exports of other Jordanian universities

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Build research data
        env:
          OPENALEX_MAILTO: mohammad.arafah@uop.edu.jo
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          SCHOLAR: ${{ github.event_name == 'push' && '0' || '1' }}
          QUICK: ${{ github.event_name == 'push' && '1' || '0' }}   # an upload rebuilds quickly; the heavy Scopus steps run weekly   # quick rebuild after an upload; Scholar is refreshed weekly
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            echo "Single-researcher runs are for checking a match; the published data is not changed."
            python scripts/update_research.py --only "${{ github.event.inputs.only }}"
            git checkout -- data/research || true
          else
            python scripts/update_research.py
          fi

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Research data $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
