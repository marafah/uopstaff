name: Publish the exam timetable

# Started by the «جدول الامتحانات» page after the committee's password (scripts/exam_inbox.py explains the requests):
# the timetable goes to data/exam_schedule.json (or is removed) and the calendar subscriptions follow at once.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "publish / unpublish / setkey"
        required: true
        type: string
      data:
        description: "sent by the exams page"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["data/exams/inbox/**"]

permissions:
  contents: write

concurrency:
  group: exam-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply the request
        env:
          EXAM_ACTION: ${{ inputs.action }}
          EXAM_DATA: ${{ inputs.data }}
        run: python scripts/exam_inbox.py
      - run: python scripts/exam_ics.py
      - name: Commit
        # the request reaches the shell only as a variable, never as script text
        env:
          EXAM_ACTION: ${{ inputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            case "$EXAM_ACTION" in
              setkey) msg="Exam publishing set up" ;;
              unpublish) msg="Exam timetable unpublished" ;;
              *) if [ -f data/exam_schedule.json ]; then msg="Exam timetable published"; else msg="Exam timetable unpublished"; fi ;;
            esac
            git commit -q -m "$msg"
            git pull --rebase --autostash -q origin main || true
            git push
          fi
