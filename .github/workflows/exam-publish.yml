name: Publish the exam timetable

# The «جدول الامتحانات» page opens GitHub on a new file in data/exams/inbox/ (publish or unpublish); committing it runs
# this at once: the timetable goes to data/exam_schedule.json (or is removed) and the calendar subscriptions follow.

on:
  push:
    branches: [main]
    paths: ["data/exams/inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exam-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/exam_inbox.py
      - run: python scripts/exam_ics.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            if [ -f data/exam_schedule.json ]; then git commit -q -m "Exam timetable published"; else git commit -q -m "Exam timetable unpublished"; fi
            git pull --rebase --autostash -q origin main || true
            git push
          fi
