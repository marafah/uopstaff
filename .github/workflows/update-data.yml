name: Update staff data, calendar and timetable

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button = update on demand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pillow pdfplumber pypdfium2
      - name: Staff directory from uop.edu.jo
        run: python scripts/update_data.py
      - name: Academic calendar from uop.edu.jo
        run: python scripts/update_calendar.py
      - name: Study timetable from edugate.uop.edu.jo
        # any mismatch fails this step only: the previous timetable stays, the other updates are still saved
        continue-on-error: true
        run: python scripts/update_timetable.py
      - name: Study plans from edugate.uop.edu.jo
        # any mismatch fails this step only: the previous plans stay, the other updates are still saved
        continue-on-error: true
        run: python scripts/update_study_plans.py
      - name: Advisory study plans from the faculty sites
        # any failure keeps the previous plans; a faculty that cannot be reached keeps what was read before
        continue-on-error: true
        run: python scripts/update_advisory.py
      - name: Course descriptions («وصف المواد») from the department pages
        # a file that cannot be downloaded keeps what was read from it before
        continue-on-error: true
        run: python scripts/update_course_desc.py
      - name: Advisory plans the text reader could not read (scanned pages), read by Claude
        # needs the repository secret ANTHROPIC_API_KEY; without it this step does nothing. A reading is published only
        # when every semester adds up to the total printed in the plan.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/advisory_ai.py
      - name: Office hours backup (from the Google Sheet service)
        continue-on-error: true
        run: python scripts/update_office_hours.py
      - name: Finance pages from uop.edu.jo (majors and fees, financial Q&A, grants — word for word)
        # a part whose official text no longer matches keeps its last good copy and is flagged on the pages
        continue-on-error: true
        run: python scripts/update_finance.py
      - name: Organizational structure (official chart check, links to the directory)
        continue-on-error: true
        run: python scripts/update_org.py
      - name: Instructor pages, calendar subscriptions, seat history
        continue-on-error: true
        run: python scripts/build_extras.py
      - name: Exam timetable calendar subscriptions (per proctor, per faculty, whole university)
        continue-on-error: true
        run: python scripts/exam_ics.py
      - name: What changed since the last run («ما الجديد؟»)
        continue-on-error: true
        run: python scripts/build_changes.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/photos
          if ! git diff --cached --quiet; then
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')"
            # the exams committee may publish the exam timetable while this runs: take their commit first
            git pull --rebase --autostash -q origin main || true
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45 * 24 * 3600)) ]; then
            # GitHub pauses scheduled workflows after 60 days without repository activity
            git commit --allow-empty -m "Keep the hourly update active (no data changes)"
            git push
          else
            echo "No changes."
          fi
