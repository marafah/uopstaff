name: Update staff data

on:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday 06:00 Amman time
  workflow_dispatch:        # "Run workflow" button = update on demand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch from uop.edu.jo
        run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/staff.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/staff.json
            git commit -m "Update staff data $(date -u +%Y-%m-%d)"
            git push
          fi
